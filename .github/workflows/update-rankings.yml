name: Update MarketWatch Leaderboard

on:
  schedule:
    # Runs every Friday at 21:15 UTC (1:15 PM Pacific Daylight Time / 2:15 PM Pacific Standard Time, right after market close at 1:00 PM PT)
    - cron: '15 21 * * 5'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch MarketWatch Standings
        env:
          MARKETWATCH_EMAIL: ${{ secrets.MARKETWATCH_EMAIL }}
          MARKETWATCH_PASSWORD: ${{ secrets.MARKETWATCH_PASSWORD }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD || 'Fall2026' }}
          MARKETWATCH_GAME_URL: 'https://www.marketwatch.com/games/fma-fall-2026-investment-game-'
        run: node scripts/fetch-standings.js

      - name: Commit and Push Updated Rankings
        run: |
          git config --global user.name "FMA Leaderboard Bot"
          git config --global user.email "bot@fma-uoregon.com"
          if [ -n "$(git status --porcelain rankings.csv)" ]; then
            git add rankings.csv
            git commit -m "chore(standings): update weekly MarketWatch rankings [skip ci]"
            git push
            echo "Standings updated and pushed to repository. Vercel will deploy automatically."
          else
            echo "No changes detected in rankings.csv."
          fi
